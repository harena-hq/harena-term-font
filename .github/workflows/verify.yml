name: verify

# Branches only. An unfiltered `push` also matches tags, so every release ran
# this ~18-minute build a second time alongside release.yml, which already
# performs the identical fetch, build, gate and hash check before publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Check dependency-free release metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -S scripts/font_version.py --semver
          package=$(node -p "require('./npm/package.json').version")
          python3 scripts/release_notes.py "$package" \
            --changelog npm/CHANGELOG.md --ref HEAD \
            --out /tmp/npm-release-notes.md
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      # libharfbuzz-bin supplies hb-shape. verify.py *skips* the NFD shaping
      # check when it is absent rather than failing, so without this the gate
      # would quietly run 145 checks and still report success.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xz-utils libharfbuzz-bin
      - name: Fetch build sources
        run: scripts/fetch_sources.sh
      - name: Build fonts
        run: python3 scripts/build.py
      - name: Hint, compress and checksum
        run: python3 scripts/postbuild.py
      # Assert the gate's explicit terminal verdict rather than duplicating its
      # evolving check count in workflow YAML.
      - name: Run conformance verification
        run: |
          python3 scripts/verify.py | tee gate.log
          grep -q '^gate: PASS$' gate.log
      - name: Verify the build is reproducible
        run: cd dist && sha256sum -c ../SHA256SUMS
      # Exercise the registry-facing contract before a tag exists. This also
      # proves that an npm-only patch may retain the recorded font version and
      # that every CSS URL resolves in an installed tarball.
      - name: Assemble and smoke-test the npm package
        run: |
          python3 scripts/test_package_npm.py
          python3 scripts/package_npm.py
          mkdir -p /tmp/harena-npm-pack /tmp/harena-npm-smoke
          npm pack ./build/npm-package --pack-destination /tmp/harena-npm-pack
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix /tmp/harena-npm-smoke /tmp/harena-npm-pack/harena-hq-term-font-*.tgz
          cd /tmp/harena-npm-smoke
          node -e "require.resolve('@harena-hq/term-font/index.css')"
          node -e "require.resolve('@harena-hq/term-font/package.json')"
          test -f node_modules/@harena-hq/term-font/fonts/HarenaTermK-Regular.woff2
      # The gate and the hash check are what this workflow is for; the binaries
      # themselves ship from Releases. Uploading 90 MB on every push would cost
      # storage to duplicate what a tag already produces.
      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: harena-term
          path: dist/
          retention-days: 7
          if-no-files-found: error
