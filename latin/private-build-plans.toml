# Parametric redraw for Harena Term.
#
# The hangul-to-Latin-cap ratio is capped by cap/(2*advance): the Latin's cap
# height relative to the CJK cell. Widening the advance lowers that ceiling,
# which is why a 0.600 base fails. Raising `cap` is the only lever that raises
# it, and doing it parametrically redraws the letters at unchanged stroke
# weight instead of scaling them, so the box-drawing frame stays matched.
#
#   cap      735 -> 808   puts hangul at ratio 1.23 with no change to the hangul
#   xHeight  520 -> 572   held proportional to cap
#   sb        60 ->  40   widens the letters so cap/ink stays near today's 2.06
#                         instead of drifting to 2.26; also brings the Latin's
#                         own letterspacing to T 0.258 against Pretendard's 0.246
#   leading 1250 -> 1350  raising cap alone does not fix the leading complaint,
#                         because that is hangul ink height against line height

[buildPlans.HarenaLatin]
family = "Harena Latin"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.HarenaLatin.weights.Regular]
shape = 500
menu = 400
css = 400

[buildPlans.HarenaLatin.weights.Bold]
shape = 800
menu = 700
css = 700

[buildPlans.HarenaLatin.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.HarenaLatin.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.HarenaLatin.metricOverride]
cap = 808
ascender = 808
xHeight = 572
sb = 45
leading = 1350
